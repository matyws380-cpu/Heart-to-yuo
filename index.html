<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    background: #000000;
    color: white;
    font-family: 'Cairo', Tahoma, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  canvas { display: block; }

  .interface {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 18px 20px;
  }

  .header {
    text-align: center;
    animation: appear 2s ease;
  }

  .header h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 3px;
    color: #ff1a3d;
    text-shadow: 0 0 25px rgba(255, 26, 61, 0.6);
  }

  .header p {
    margin-top: 6px;
    color: #a93a4a;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .footer {
    font-size: 9px;
    color: #4a1a2a;
    letter-spacing: 3px;
    direction: ltr;
    text-transform: uppercase;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .splash.hide {
    opacity: 0;
    visibility: hidden;
  }

  .splash-heart {
    font-size: 60px;
    animation: splashPulse 1.2s infinite;
    filter: drop-shadow(0 0 30px #ff1a3d);
  }

  @keyframes splashPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .splash-text {
    color: #ff1a3d;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .splash-bar {
    width: 160px;
    height: 2px;
    background: rgba(255, 26, 61, 0.2);
    border-radius: 2px;
    overflow: hidden;
  }

  .splash-bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #ff1a3d, transparent);
    animation: splashLoad 1.5s ease-in-out infinite;
  }

  @keyframes splashLoad {
    0% { transform: translateX(400%); }
    100% { transform: translateX(-250%); }
  }

  .controls {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-btn {
    padding: 10px 18px;
    background: rgba(255, 26, 61, 0.12);
    border: 1px solid rgba(255, 26, 61, 0.4);
    border-radius: 30px;
    color: #ff1a3d;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctrl-btn:hover {
    background: rgba(255, 26, 61, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 26, 61, 0.4);
  }

  .ctrl-btn.active {
    background: rgba(255, 26, 61, 0.4);
    box-shadow: 0 0 25px rgba(255, 26, 61, 0.6);
  }

  .ctrl-btn.hidden { display: none; }
</style>
</head>

<div class="splash" id="splash">
  <div class="splash-heart">💕</div>
  <div class="splash-text">جاري التحميل...</div>
  <div class="splash-bar"></div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="soundBtn">🔊 تشغيل الصوت</button>

<div id="canvas-container"></div>

    "Volim te", "Volim te jako", "Moja ljubavi", "Moj živote", "Moje srce",
    "Волим те", "Волим те много", "Моја љубави", "Мој животе",
    "Обичам те", "Обичам те много", "Моята любов", "Моят живот",
    "Aš tave myliu", "Aš tave labai myliu", "Mano meilė", "Mano gyvenimas",
    "Es tevi mīlu", "Es tevi ļoti mīlu", "Mana mīlestība", "Mana dzīve",
    "Ma armastan sind", "Ma armastan sind väga", "Mu armastus", "Mu elu",
    "Ljubim te", "Ljubim te zelo", "Moja ljubezen", "Moje življenje",
    "Ľúbim ťa", "Ľúbim ťa veľmi", "Moja láska", "Môj život",
    "T'estimo", "T'estimo molt", "El meu amor", "La meva vida",
    "Ek is lief vir jou", "Ek is baie lief vir jou", "My liefde", "My lewe",
    "Ngiyakuthanda", "Ngiyakuthanda kakhulu", "Uthando lwami",
    "S'agapo", "Σε λατρεύω", "Amour infini", "Amor eterno",
    "Te amo para siempre", "Ti amo per sempre", "Ich liebe dich für immer",
    "Eu te amo para sempre", "Ik hou voor altijd van je", "Jag älskar dig för alltid",
    "Я люблю тебя навсегда", "Seni sonsuza kadar seviyorum", "永远爱你", "永遠に愛してる",
    "영원히 사랑해", "मैं हमेशा तुमसे प्यार करूँगा", "אני אוהב אותך לנצח", "ฉันรักคุณตลอดไป"
  ];

  const uniqueWords = [...new Set(loveWords)];
  const random = (min, max) => Math.random() * (min - max) + max;
  // صححنا الـ random
  const rand = (min, max) => Math.random() * (max - min) + min;
  
  const colorHex = '#ff0000'; // أحمر نقي
  const colorNum = 0xff0000;

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.008);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 32);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const pointLight1 = new THREE.PointLight(colorNum, 1.5, 80);
  pointLight1.position.set(10, 10, 15);
  scene.add(pointLight1);
  const pointLight2 = new THREE.PointLight(colorNum, 1, 80);
  pointLight2.position.set(-10, -10, 15);
  scene.add(pointLight2);

  function getHeartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x, y };
  }

  const sprites = [];
  const totalWords = 280;
  
  function makeTextTexture(text, fontSize = 64) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = `800 ${fontSize}px Cairo, Tahoma, sans-serif`;
    const metrics = ctx.measureText(text);
    const textWidth = metrics.width;
    
    canvas.width = Math.ceil(textWidth + 40);
    canvas.height = fontSize + 40;
    
    const ctx2 = canvas.getContext('2d');
    ctx2.clearRect(0, 0, canvas.width, canvas.height);
    ctx2.font = `800 ${fontSize}px Cairo, Tahoma, sans-serif`;
    ctx2.textAlign = 'center';
    ctx2.textBaseline = 'middle';
    
    ctx2.shadowColor = colorHex;
    ctx2.shadowBlur = 8;
    ctx2.fillStyle = colorHex;
    ctx2.fillText(text, canvas.width / 2, canvas.height / 2);
    
    ctx2.shadowBlur = 0;
    ctx2.fillText(text, canvas.width / 2, canvas.height / 2);
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    return texture;
  }

  function generateHeartPoints(count) {
    const points = [];
    for (let i = 0; i < count; i++) {
      const t = rand(0, Math.PI * 2);
      const edge = getHeartPoint(t);
      const radius = Math.sqrt(Math.random());
      const x = edge.x * radius;
      const y = edge.y * radius;
      const z = rand(-0.4, 0.4) * Math.sqrt(Math.abs(x * y)) * 0.5;
      points.push({ x, y, z });
    }
    return points;
  }

  const heartPoints = generateHeartPoints(totalWords);

  // ترتيب حسب y — من تحت لفوق
  const heartPointsWithOrder = heartPoints.map((p, i) => ({ ...p, originalIndex: i }));
  heartPointsWithOrder.sort((a, b) => a.y - b.y);

  const revealDuration = 6;
  const buildDuration = 4;

  for (let i = 0; i < totalWords; i++) {
    const word = uniqueWords[i % uniqueWords.length];
    const texture = makeTextTexture(word, 48);
    
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.NormalBlending
    });
    
    const sprite = new THREE.Sprite(material);
    const size = rand(0.7, 1.6);
    sprite.scale.set(size * 3, size, 1);
    
    const pointData = heartPointsWithOrder[i];
    const orderProgress = i / totalWords;
    
    const scale = 0.95;
    const targetX = pointData.x * scale;
    const targetY = pointData.y * scale;
    const targetZ = pointData.z * 2;
    
    const screenAngle = rand(0, Math.PI * 2);
    const screenDist = rand(15, 35);
    const startX = Math.cos(screenAngle) * screenDist;
    const startY = Math.sin(screenAngle) * screenDist;
    const startZ = rand(-15, 15);
    
    const appearDelay = (i / totalWords) * 2.5 + rand(0, 0.3);
    const moveDelay = 3.5 + orderProgress * revealDuration;
    
    sprite.userData = {
      targetX, targetY, targetZ,
      startX, startY, startZ,
      appearDelay, moveDelay,
      duration: buildDuration,
      floatOffset: rand(0, Math.PI * 2),
      floatSpeed: rand(0.3, 0.8),
      baseX: targetX,
      baseY: targetY,
      baseZ: targetZ
    };
    
    sprite.position.set(startX, startY, startZ);
    scene.add(sprite);
    sprites.push(sprite);
  }

  // Stars
  const starCount = 500;
  const starGeometry = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const angle = rand(0, Math.PI * 2);
    const radius = rand(30, 120);
    starPositions[i * 3] = Math.cos(angle) * radius;
    starPositions[i * 3 + 1] = Math.sin(angle) * radius;
    starPositions[i * 3 + 2] = rand(-70, 70);
  }
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  
  const starMaterial = new THREE.PointsMaterial({
    color: 0xff3355,
    size: 0.5,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
  
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Audio
  let audioCtx = null;
  let heartbeatEnabled = false;
  let lastBeatTime = 0;
  const beatInterval = 0.9;
  let heartComplete = false;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  }

  function playHeartbeat() {
    if (!audioCtx || !heartbeatEnabled) return;
    const now = audioCtx.currentTime;
    
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    const filter1 = audioCtx.createBiquadFilter();
    
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(60, now);
    osc1.frequency.exponentialRampToValueAtTime(35, now + 0.15);
    
    filter1.type = 'lowpass';
    filter1.frequency.setValueAtTime(200, now);
    filter1.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    
    gain1.gain.setValueAtTime(0.0001, now);
    gain1.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    
    osc1.connect(filter1);
    filter1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.3);
    
    const now2 = now + 0.25;
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    const filter2 = audioCtx.createBiquadFilter();
    
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(50, now2);
    osc2.frequency.exponentialRampToValueAtTime(30, now2 + 0.12);
    
    filter2.type = 'lowpass';
    filter2.frequency.setValueAtTime(180, now2);
    filter2.frequency.exponentialRampToValueAtTime(70, now2 + 0.12);
    
    gain2.gain.setValueAtTime(0.0001, now2);
    gain2.gain.exponentialRampToValueAtTime(0.3, now2 + 0.02);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now2 + 0.2);
    
    osc2.connect(filter2);
    filter2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now2);
    osc2.stop(now2 + 0.25);
  }

  const soundBtn = document.getElementById('soundBtn');
  
  soundBtn.addEventListener('click', () => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    if (soundBtn.dataset.on === 'true') {
      heartbeatEnabled = false;
      soundBtn.textContent = '🔊 تشغيل الصوت';
      soundBtn.classList.remove('active');
      soundBtn.dataset.on = 'false';
    } else {
      heartbeatEnabled = true;
      lastBeatTime = performance.now() / 1000;
      soundBtn.textContent = '🔇 إيقاف النبض';
      soundBtn.classList.add('active');
      soundBtn.dataset.on = 'true';
    }
  });

  const startTime = performance.now();
  const heartGroup = new THREE.Group();
  scene.add(heartGroup);
  sprites.forEach(s => heartGroup.add(s));

  let mouseX = 0, mouseY = 0;
  let targetMouseX = 0, targetMouseY = 0;

  document.addEventListener('mousemove', (e) => {
    targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      targetMouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
      targetMouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
    }
  }, { passive: true });

  function animate() {
    requestAnimationFrame(animate);
    
    const time = performance.now();
    const elapsed = (time - startTime) / 1000;
    const t = elapsed;
    
    // camera parallax
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;
    
    camera.position.x = mouseX * 8;
    camera.position.y = -mouseY * 6;
    camera.lookAt(0, 0, 0);
    
    // Heart pulse — بس بعد ما القلب يتكون
    let pulse = 1;
    if (heartComplete) {
      pulse = 1 + Math.sin(t * 3) * 0.07;
    }
    heartGroup.scale.setScalar(pulse);
    
    // مفيش دوران — القلب ثابت
    heartGroup.rotation.y = 0;
    heartGroup.rotation.x = 0;
    
    // Heartbeat — بس بعد ما القلب يتكون
    if (heartComplete && heartbeatEnabled) {
      const currentTime = time / 1000;
      if (currentTime - lastBeatTime >= beatInterval) {
        playHeartbeat();
        lastBeatTime = currentTime;
      }
    }
    
    let allSettled = true;
    
    sprites.forEach((sprite) => {
      const data = sprite.userData;
      
      const appearProgress = Math.max(0, Math.min(1, (elapsed - data.appearDelay) / 0.4));
      
      if (appearProgress <= 0) {
        sprite.material.opacity = 0;
        allSettled = false;
        return;
      }
      
      const moveProgress = Math.max(0, Math.min(1, (elapsed - data.moveDelay) / data.duration));
      
      if (moveProgress < 1) allSettled = false;
      
      const ease = moveProgress < 0.5
        ? 4 * moveProgress * moveProgress * moveProgress
        : 1 - Math.pow(-2 * moveProgress + 2, 3) / 2;
      
      if (moveProgress > 0) {
        sprite.position.x = data.startX + (data.targetX - data.startX) * ease;
        sprite.position.y = data.startY + (data.targetY - data.startY) * ease;
        sprite.position.z = data.startZ + (data.targetZ - data.startZ) * ease;
      } else {
        sprite.position.x = data.startX + Math.sin(t * 0.5 + data.floatOffset) * 1;
        sprite.position.y = data.startY + Math.cos(t * 0.5 + data.floatOffset) * 1;
      }
      
      if (moveProgress > 0.95) {
        const floatAmt = (moveProgress - 0.95) * 20;
        sprite.position.x = data.baseX + Math.sin(t * data.floatSpeed + data.floatOffset) * floatAmt * 0.15;
        sprite.position.y = data.baseY + Math.cos(t * data.floatSpeed + data.floatOffset) * floatAmt * 0.15;
        sprite.position.z = data.baseZ + Math.sin(t * data.floatSpeed * 0.7 + data.floatOffset) * floatAmt * 0.1;
      }
      
      if (moveProgress > 0) {
        sprite.material.opacity = 0.9;
      } else {
        sprite.material.opacity = appearProgress * 0.9;
      }
    });
    
    if (!heartComplete && allSettled && elapsed > 10) {
      heartComplete = true;
      console.log('💕 Heart complete!');
    }
    
    stars.rotation.y = t * 0.02;
    stars.rotation.x = Math.sin(t * 0.1) * 0.05;
    starMaterial.opacity = 0.5 + Math.sin(t * 2) * 0.15;
    
    pointLight1.position.x = Math.sin(t * 0.5) * 15;
    pointLight1.position.y = Math.cos(t * 0.5) * 15;
    pointLight2.position.x = Math.sin(t * 0.5 + Math.PI) * 15;
    pointLight2.position.y = Math.cos(t * 0.5 + Math.PI) * 15;
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
  }, 1200);

  animate();
</script>

</body>
</html>
